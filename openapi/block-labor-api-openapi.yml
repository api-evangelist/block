components:
  schemas:
    ShiftWorkday:
      type: object
      description: 'A `Shift` search query filter parameter that sets a range of days that

        a `Shift` must start or end in before passing the filter condition.


        Deprecated at Square API version 2025-05-21. See the [migration notes](https://developer.squareup.com/docs/labor-api/what-it-does#migration-notes).'
      x-release-status: DEPRECATED
      properties:
        date_range:
          $ref: '#/components/schemas/DateRange'
          description: Dates for fetching the shifts.
        match_shifts_by:
          $ref: '#/components/schemas/ShiftWorkdayMatcher'
          description: 'The strategy on which the dates are applied.

            See [ShiftWorkdayMatcher](#type-shiftworkdaymatcher) for possible values'
        default_timezone:
          type:
          - string
          - 'null'
          description: 'Location-specific timezones convert workdays to datetime filters.

            Every location included in the query must have a timezone or this field

            must be provided as a fallback. Format: the IANA timezone database

            identifier for the relevant timezone.'
    TimecardSortField:
      type: string
      enum:
      - START_AT
      - END_AT
      - CREATED_AT
      - UPDATED_AT
      x-enum-elements:
      - name: START_AT
        description: The start date/time of a `Timecard`
      - name: END_AT
        description: The end date/time of a `Timecard`
      - name: CREATED_AT
        description: The date/time that a `Timecard` is created
      - name: UPDATED_AT
        description: The most recent date/time that a `Timecard` is updated
      description: Enumerates the `Timecard` fields to sort on.
      x-release-status: PUBLIC
    ScheduledShiftFilter:
      type: object
      description: 'Defines filter criteria for a [SearchScheduledShifts](api-endpoint:Labor-SearchScheduledShifts)

        request. Multiple filters in a query are combined as an `AND` operation.'
      x-release-status: BETA
      properties:
        location_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Return shifts for the specified locations. When omitted, shifts for all

            locations are returned. If needed, call [ListLocations](api-endpoint:Locations-ListLocations)

            to get location IDs.'
        start:
          $ref: '#/components/schemas/TimeRange'
          description: 'Return shifts whose `start_at` time is within the specified

            time range (inclusive).'
        end:
          $ref: '#/components/schemas/TimeRange'
          description: 'Return shifts whose `end_at` time is within the specified

            time range (inclusive).'
        workday:
          $ref: '#/components/schemas/ScheduledShiftWorkday'
          description: Return shifts based on a workday date range.
        team_member_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'Return shifts assigned to specified team members. If needed, call

            [SearchTeamMembers](api-endpoint:Team-SearchTeamMembers) to get team member IDs.


            To return only the shifts assigned to the specified team members, include the

            `assignment_status` filter in the query. Otherwise, all unassigned shifts are

            returned along with shifts assigned to the specified team members.'
        assignment_status:
          $ref: '#/components/schemas/ScheduledShiftFilterAssignmentStatus'
          description: 'Return shifts based on whether a team member is assigned. A shift is

            assigned if the `team_member_id` field is populated in the `draft_shift_details`

            or `published_shift details` field of the shift.


            To return only draft or published shifts, include the `scheduled_shift_statuses`

            filter in the query.

            See [ScheduledShiftFilterAssignmentStatus](#type-scheduledshiftfilterassignmentstatus) for possible values'
        scheduled_shift_statuses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ScheduledShiftFilterScheduledShiftStatus'
          description: 'Return shifts based on the draft or published status of the shift.

            A shift is published if the `published_shift_details` field is present.


            Note that shifts with `draft_shift_details.is_deleted` set to `true` are ignored

            with the `DRAFT` filter.

            See [ScheduledShiftFilterScheduledShiftStatus](#type-scheduledshiftfilterscheduledshiftstatus) for possible values'
    SortOrder:
      type: string
      enum:
      - DESC
      - ASC
      x-enum-elements:
      - name: DESC
        description: The results are returned in descending (e.g., newest-first or Z-A) order.
      - name: ASC
        description: The results are returned in ascending (e.g., oldest-first or A-Z) order.
      description: The order (e.g., chronological or alphabetical) in which results from a request are returned.
      x-release-status: PUBLIC
    SearchScheduledShiftsResponse:
