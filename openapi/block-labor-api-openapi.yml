    Timecard:
      type: object
      description: 'A record of the hourly rate, start time, and end time of a single timecard (shift)

        for a team member. This might include a record of the start and end times of breaks

        taken during the shift.'
      x-release-status: PUBLIC
      required:
      - location_id
      - start_at
      - team_member_id
      properties:
        id:
          type: string
          description: '**Read only** The Square-issued UUID for this object.'
          maxLength: 255
        location_id:
          type: string
          description: 'The ID of the [location](entity:Location) for this timecard. The location should be based on

            where the team member clocked in.'
          minLength: 1
        timezone:
          type:
          - string
          - 'null'
          description: '**Read only** The time zone calculated from the location based on the `location_id`,

            provided as a convenience value. Format: the IANA time zone database identifier for the

            location time zone.'
        start_at:
          type: string
          description: 'The start time of the timecard, in RFC 3339 format and shifted to the location

            timezone + offset. Precision up to the minute is respected; seconds are truncated.'
          minLength: 1
        end_at:
          type:
          - string
          - 'null'
          description: 'The end time of the timecard, in RFC 3339 format and shifted to the location

            timezone + offset. Precision up to the minute is respected; seconds are truncated.'
        wage:
          $ref: '#/components/schemas/TimecardWage'
          description: 'Job and pay related information. If the wage is not set on create, it defaults to a wage

            of zero. If the title is not set on create, it defaults to the name of the role the team member

            is assigned to, if any.'
        breaks:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Break'
          description: A list of all the paid or unpaid breaks that were taken during this timecard.
        status:
          $ref: '#/components/schemas/TimecardStatus'
          description: 'Describes the working state of the timecard.

            See [TimecardStatus](#type-timecardstatus) for possible values'
        version:
          type: integer
          description: '**Read only** The current version of the timecard, which is incremented with each update.

            This field is used for [optimistic concurrency](https://developer.squareup.com/docs/build-basics/common-api-patterns/optimistic-concurrency)

            control to ensure that requests don''t overwrite data from another request.'
        created_at:
          type: string
          description: The timestamp of when the timecard was created, in RFC 3339 format presented as UTC.
          readOnly: true
        updated_at:
          type: string
          description: The timestamp of when the timecard was last updated, in RFC 3339 format presented as UTC.
          readOnly: true
        team_member_id:
          type: string
          description: The ID of the [team member](entity:TeamMember) this timecard belongs to.
          minLength: 1
        declared_cash_tip_money:
          $ref: '#/components/schemas/Money'
          description: The cash tips declared by the team member for this timecard.
