        such as job ID, team member assignment, and start and end times.'
      x-release-status: BETA
      properties:
        team_member_id:
          type:
          - string
          - 'null'
          description: The ID of the [team member](entity:TeamMember) scheduled for the shift.
          maxLength: 255
        location_id:
          type:
          - string
          - 'null'
          description: The ID of the [location](entity:Location) the shift is scheduled for.
          maxLength: 255
        job_id:
          type:
          - string
          - 'null'
          description: The ID of the [job](entity:Job) the shift is scheduled for.
        start_at:
          type:
          - string
          - 'null'
          description: 'The start time of the shift, in RFC 3339 format in the time zone &plus;

            offset of the shift location specified in `location_id`. Precision up to the minute

            is respected; seconds are truncated.'
        end_at:
          type:
          - string
          - 'null'
          description: 'The end time for the shift, in RFC 3339 format in the time zone &plus;

            offset of the shift location specified in `location_id`. Precision up to the minute

            is respected; seconds are truncated.'
        notes:
          type:
          - string
          - 'null'
          description: Optional notes for the shift.
          maxLength: 1000
        is_deleted:
          type:
