    ScheduledShift:
      type: object
      description: 'Represents a specific time slot in a work schedule. This object is used to manage the

        lifecycle of a scheduled shift from the draft to published state. A scheduled shift contains

        the latest draft shift details and current published shift details.'
      x-release-status: BETA
      properties:
        id:
          type: string
          description: '**Read only** The Square-issued ID of the scheduled shift.'
          maxLength: 255
        draft_shift_details:
          $ref: '#/components/schemas/ScheduledShiftDetails'
          description: 'The latest draft shift details for the scheduled shift. Draft shift details are used to

            stage and manage shifts before publishing. This field is always present.'
        published_shift_details:
          $ref: '#/components/schemas/ScheduledShiftDetails'
          description: 'The current published (public) shift details for the scheduled shift. This field is

            present only if the shift was published.'
          readOnly: true
        version:
          type: integer
          description: '**Read only** The current version of the scheduled shift, which is incremented with each update.

            This field is used for [optimistic concurrency](https://developer.squareup.com/docs/build-basics/common-api-patterns/optimistic-concurrency)

            control to ensure that requests don''t overwrite data from another request.'
        created_at:
          type: string
          description: The timestamp of when the scheduled shift was created, in RFC 3339 format presented as UTC.
          readOnly: true
        updated_at:
          type: string
          description: The timestamp of when the scheduled shift was last updated, in RFC 3339 format presented as UTC.
          readOnly: true
    ShiftFilterStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
