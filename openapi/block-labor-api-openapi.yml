openapi: 3.2.0
info:
  version: '2.0'
  title: Square Labor API
  description: Use Square APIs to manage and run business including payment, customer, product, inventory, and employee management.
  termsOfService: https://connect.squareup.com/tos
  contact:
    name: Square Developer Platform
    email: developers@squareup.com
    url: https://squareup.com/developers
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  externalDocs:
    description: 'Read the official documentation here:'
    url: https://docs.connect.squareup.com/
  x-server-configuration:
    default-environment: production
    default-server: default
    environments:
    - name: production
      servers:
      - name: default
        url: https://connect.squareup.com
    - name: sandbox
      servers:
      - name: default
        url: https://connect.squareupsandbox.com
    - name: custom
      servers:
      - name: default
        url: '{custom_url}'
    parameters:
    - name: custom_url
      description: Sets the base URL requests are made to. Defaults to `https://connect.squareup.com`
      type: string
      example: https://connect.squareup.com
  x-square-generic-error-codes:
  - ACCESS_TOKEN_EXPIRED
  - ACCESS_TOKEN_REVOKED
  - API_VERSION_INCOMPATIBLE
  - APPLICATION_DISABLED
  - ARRAY_EMPTY
  - ARRAY_LENGTH_TOO_LONG
  - ARRAY_LENGTH_TOO_SHORT
  - BAD_CERTIFICATE
  - BAD_GATEWAY
  - BAD_REQUEST
  - CONFLICT
  - CONFLICTING_PARAMETERS
  - CURRENCY_MISMATCH
  - EXPECTED_ARRAY
  - EXPECTED_BASE64_ENCODED_BYTE_ARRAY
  - EXPECTED_BOOLEAN
  - EXPECTED_FLOAT
  - EXPECTED_INTEGER
  - EXPECTED_JSON_BODY
  - EXPECTED_MAP
  - EXPECTED_OBJECT
  - EXPECTED_STRING
  - FORBIDDEN
  - GATEWAY_TIMEOUT
  - GONE
  - IDEMPOTENCY_KEY_REUSED
  - INCORRECT_TYPE
  - INSUFFICIENT_SCOPES
  - INTERNAL_SERVER_ERROR
  - INVALID_ARRAY_VALUE
  - INVALID_CONTENT_TYPE
  - INVALID_CURSOR
  - INVALID_ENUM_VALUE
  - INVALID_FORM_VALUE
  - INVALID_SORT_ORDER
  - INVALID_SQUARE_VERSION_FORMAT
  - INVALID_TIME
  - INVALID_TIME_RANGE
  - INVALID_VALUE
  - LOCATION_MISMATCH
  - MAP_KEY_LENGTH_TOO_LONG
  - MAP_KEY_LENGTH_TOO_SHORT
  - MERCHANT_SUBSCRIPTION_NOT_FOUND
  - METHOD_NOT_ALLOWED
  - MISSING_REQUIRED_PARAMETER
  - NOT_ACCEPTABLE
  - NOT_FOUND
  - NOT_IMPLEMENTED
  - NO_FIELDS_SET
  - RATE_LIMITED
  - REQUEST_ENTITY_TOO_LARGE
  - REQUEST_TIMEOUT
  - SANDBOX_NOT_SUPPORTED
  - SERVICE_UNAVAILABLE
  - TOO_MANY_MAP_ENTRIES
  - UNAUTHORIZED
  - UNEXPECTED_VALUE
  - UNKNOWN_BODY_PARAMETER
  - UNKNOWN_QUERY_PARAMETER
  - UNPROCESSABLE_ENTITY
  - UNSUPPORTED_MEDIA_TYPE
  - V1_ACCESS_TOKEN
  - V1_APPLICATION
  - VALUE_EMPTY
  - VALUE_REGEX_MISMATCH
  - VALUE_TOO_HIGH
  - VALUE_TOO_LONG
  - VALUE_TOO_LOW
  - VALUE_TOO_SHORT
servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: Labor
paths:
  /v2/labor/break-types:
    get:
      tags:
      - Labor
      summary: ListBreakTypes
      operationId: ListBreakTypes
      description: Returns a paginated list of `BreakType` instances for a business.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - TIMECARDS_SETTINGS_READ
      parameters:
      - name: location_id
        description: 'Filter the returned `BreakType` results to only those that are associated with the

          specified location.'
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'The maximum number of `BreakType` results to return per page. The number can range between 1

          and 200. The default is 200.'
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: A pointer to the next page of `BreakType` results to fetch.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBreakTypesResponse'
    post:
      tags:
      - Labor
      summary: CreateBreakType
      operationId: CreateBreakType
      description: 'Creates a new `BreakType`.


        A `BreakType` is a template for creating `Break` objects.

        You must provide the following values in your request to this

        endpoint:


        - `location_id`

        - `break_name`

        - `expected_duration`

        - `is_paid`


        You can only have three `BreakType` instances per location. If you attempt to add a fourth

        `BreakType` for a location, an `INVALID_REQUEST_ERROR` "Exceeded limit of 3 breaks per location."

        is returned.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - TIMECARDS_SETTINGS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBreakTypeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBreakTypeResponse'
  /v2/labor/break-types/{id}:
    delete:
      tags:
      - Labor
      summary: DeleteBreakType
      operationId: DeleteBreakType
      description: 'Deletes an existing `BreakType`.


        A `BreakType` can be deleted even if it is referenced from a `Shift`.'
      x-release-status: PUBLIC
      security:
      - oauth2:
        - TIMECARDS_SETTINGS_WRITE
      parameters:
      - name: id
        description: The UUID for the `BreakType` being deleted.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBreakTypeResponse'
    get:
      tags:
      - Labor
      summary: GetBreakType
      operationId: GetBreakType
      description: Returns a single `BreakType` specified by `id`.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - TIMECARDS_SETTINGS_READ
      parameters:
      - name: id
        description: The UUID for the `BreakType` being retrieved.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBreakTypeResponse'
    put:
      tags:
      - Labor
      summary: UpdateBreakType
      operationId: UpdateBreakType
      description: Updates an existing `BreakType`.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - TIMECARDS_SETTINGS_WRITE
        - TIMECARDS_SETTINGS_READ
      parameters:
      - name: id
        description: ' The UUID for the `BreakType` being updated.'
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBreakTypeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBreakTypeResponse'
  /v2/labor/employee-wages:
    get:
      tags:
      - Labor
      summary: ListEmployeeWages
      operationId: ListEmployeeWages
      description: Returns a paginated list of `EmployeeWage` instances for a business.
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2020-08-26'
        retirementDate: TBD
        replacedBy: ListTeamMemberWages
        guideUrl: https://developer.squareup.com/docs/labor-api/migrate-to-teams
      security:
      - oauth2:
        - EMPLOYEES_READ
      parameters:
      - name: employee_id
        description: Filter the returned wages to only those that are associated with the specified employee.
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'The maximum number of `EmployeeWage` results to return per page. The number can range between

          1 and 200. The default is 200.'
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: A pointer to the next page of `EmployeeWage` results to fetch.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEmployeeWagesResponse'
  /v2/labor/employee-wages/{id}:
    get:
      tags:
      - Labor
      summary: GetEmployeeWage
      operationId: GetEmployeeWage
      description: Returns a single `EmployeeWage` specified by `id`.
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2020-08-26'
        retirementDate: TBD
        replacedBy: GetTeamMemberWage
        guideUrl: https://developer.squareup.com/docs/labor-api/migrate-to-teams
      security:
      - oauth2:
        - EMPLOYEES_READ
      parameters:
      - name: id
        description: The UUID for the `EmployeeWage` being retrieved.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmployeeWageResponse'
  /v2/labor/scheduled-shifts:
    post:
      tags:
      - Labor
      summary: CreateScheduledShift
      operationId: CreateScheduledShift
      description: 'Creates a scheduled shift by providing draft shift details such as job ID,

        team member assignment, and start and end times.


        The following `draft_shift_details` fields are required:

        - `location_id`

        - `job_id`

        - `start_at`

        - `end_at`'
      x-release-status: BETA
      security:
      - oauth2:
        - TIMECARDS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduledShiftRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScheduledShiftResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: INVALID_VALUE
  /v2/labor/scheduled-shifts/bulk-publish:
    post:
      tags:
      - Labor
      summary: BulkPublishScheduledShifts
      operationId: BulkPublishScheduledShifts
      description: 'Publishes 1 - 100 scheduled shifts. This endpoint takes a map of individual publish

        requests and returns a map of responses. When a scheduled shift is published, Square keeps

        the `draft_shift_details` field as is and copies it to the `published_shift_details` field.


        The minimum `start_at` and maximum `end_at` timestamps of all shifts in a

        `BulkPublishScheduledShifts` request must fall within a two-week period.'
      x-release-status: BETA
      security:
      - oauth2:
        - TIMECARDS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPublishScheduledShiftsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPublishScheduledShiftsResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: INVALID_VALUE
  /v2/labor/scheduled-shifts/search:
    post:
      tags:
      - Labor
      summary: SearchScheduledShifts
      operationId: SearchScheduledShifts
      description: 'Returns a paginated list of scheduled shifts, with optional filter and sort settings.

        By default, results are sorted by `start_at` in ascending order.'
      x-release-status: BETA
      security:
      - oauth2:
        - TIMECARDS_READ
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchScheduledShiftsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchScheduledShiftsResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: EXPECTED_STRING
      - error-code: INVALID_VALUE
      - error-code: NOT_FOUND
  /v2/labor/scheduled-shifts/{id}:
    get:
      tags:
      - Labor
      summary: RetrieveScheduledShift
      operationId: RetrieveScheduledShift
      description: Retrieves a scheduled shift by ID.
      x-release-status: BETA
      security:
      - oauth2:
        - TIMECARDS_READ
      parameters:
      - name: id
        description: The ID of the scheduled shift to retrieve.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveScheduledShiftResponse'
      x-endpoint-errors:
      - error-code: NOT_FOUND
    put:
      tags:
      - Labor
      summary: UpdateScheduledShift
      operationId: UpdateScheduledShift
      description: 'Updates the draft shift details for a scheduled shift. This endpoint supports

        sparse updates, so only new, changed, or removed fields are required in the request.

        You must publish the shift to make updates public.


        You can make the following updates to `draft_shift_details`:

        - Change the `location_id`, `job_id`, `start_at`, and `end_at` fields.

        - Add, change, or clear the `team_member_id` and `notes` fields. To clear these fields,

        set the value to null.

        - Change the `is_deleted` field. To delete a scheduled shift, set `is_deleted` to true

        and then publish the shift.'
      x-release-status: BETA
      security:
      - oauth2:
        - TIMECARDS_WRITE
      parameters:
      - name: id
        description: The ID of the scheduled shift to update.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduledShiftRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateScheduledShiftResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: INVALID_VALUE
      - error-code: VERSION_MISMATCH
  /v2/labor/scheduled-shifts/{id}/publish:
    post:
      tags:
      - Labor
      summary: PublishScheduledShift
      operationId: PublishScheduledShift
      description: 'Publishes a scheduled shift. When a scheduled shift is published, Square keeps the

        `draft_shift_details` field as is and copies it to the `published_shift_details` field.'
      x-release-status: BETA
      security:
      - oauth2:
        - TIMECARDS_WRITE
      parameters:
      - name: id
        description: The ID of the scheduled shift to publish.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishScheduledShiftRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishScheduledShiftResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: INVALID_VALUE
  /v2/labor/shifts:
    post:
      tags:
      - Labor
      summary: CreateShift
      operationId: CreateShift
      description: 'Creates a new `Shift`.


        A `Shift` represents a complete workday for a single team member.

        You must provide the following values in your request to this

        endpoint:


        - `location_id`

        - `team_member_id`

        - `start_at`


        An attempt to create a new `Shift` can result in a `BAD_REQUEST` error when:

        - The `status` of the new `Shift` is `OPEN` and the team member has another

        shift with an `OPEN` status.

        - The `start_at` date is in the future.

        - The `start_at` or `end_at` date overlaps another shift for the same team member.

        - The `Break` instances are set in the request and a break `start_at`

        is before the `Shift.start_at`, a break `end_at` is after

        the `Shift.end_at`, or both.'
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2025-05-21'
        retirementDate: '2026-05-21'
        replacedBy: CreateTimecard
        guideUrl: https://developer.squareup.com/docs/labor-api/what-it-does#migration-notes
      security:
      - oauth2:
        - TIMECARDS_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShiftRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateShiftResponse'
  /v2/labor/shifts/search:
    post:
      tags:
      - Labor
      summary: SearchShifts
      operationId: SearchShifts
      description: 'Returns a paginated list of `Shift` records for a business.

        The list to be returned can be filtered by:

        - Location IDs

        - Team member IDs

        - Shift status (`OPEN` or `CLOSED`)

        - Shift start

        - Shift end

        - Workday details


        The list can be sorted by:

        - `START_AT`

        - `END_AT`

        - `CREATED_AT`

        - `UPDATED_AT`'
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2025-05-21'
        retirementDate: '2026-05-21'
        replacedBy: SearchTimecards
        guideUrl: https://developer.squareup.com/docs/labor-api/what-it-does#migration-notes
      security:
      - oauth2:
        - TIMECARDS_READ
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchShiftsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchShiftsResponse'
  /v2/labor/shifts/{id}:
    delete:
      tags:
      - Labor
      summary: DeleteShift
      operationId: DeleteShift
      description: Deletes a `Shift`.
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2025-05-21'
        retirementDate: '2026-05-21'
        replacedBy: DeleteTimecard
        guideUrl: https://developer.squareup.com/docs/labor-api/what-it-does#migration-notes
      security:
      - oauth2:
        - TIMECARDS_WRITE
      parameters:
      - name: id
        description: The UUID for the `Shift` being deleted.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteShiftResponse'
    get:
      tags:
      - Labor
      summary: GetShift
      operationId: GetShift
      description: Returns a single `Shift` specified by `id`.
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2025-05-21'
        retirementDate: '2026-05-21'
        replacedBy: RetrieveTimecard
        guideUrl: https://developer.squareup.com/docs/labor-api/what-it-does#migration-notes
      security:
      - oauth2:
        - TIMECARDS_READ
      parameters:
      - name: id
        description: The UUID for the `Shift` being retrieved.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetShiftResponse'
    put:
      tags:
      - Labor
      summary: UpdateShift
      operationId: UpdateShift
      description: 'Updates an existing `Shift`.


        When adding a `Break` to a `Shift`, any earlier `Break` instances in the `Shift` have

        the `end_at` property set to a valid RFC-3339 datetime string.


        When closing a `Shift`, all `Break` instances in the `Shift` must be complete with `end_at`

        set on each `Break`.'
      x-release-status: DEPRECATED
      deprecated: true
      x-deprecation:
        deprecationDate: '2025-05-21'
        retirementDate: '2026-05-21'
        replacedBy: UpdateTimecard
        guideUrl: https://developer.squareup.com/docs/labor-api/what-it-does#migration-notes
      security:
      - oauth2:
        - TIMECARDS_WRITE
        - TIMECARDS_READ
      parameters:
      - name: id
        description: The ID of the object being updated.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateShiftResponse'
  /v2/labor/team-member-wages:
    get:
      tags:
      - Labor
      summary: ListTeamMemberWages
      operationId: ListTeamMemberWages
      description: Returns a paginated list of `TeamMemberWage` instances for a business.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - EMPLOYEES_READ
      parameters:
      - name: team_member_id
        description: 'Filter the returned wages to only those that are associated with the

          specified team member.'
        schema:
          type: string
        in: query
        required: false
      - name: limit
        description: 'The maximum number of `TeamMemberWage` results to return per page. The number can range between

          1 and 200. The default is 200.'
        schema:
          type: integer
        in: query
        required: false
      - name: cursor
        description: A pointer to the next page of `EmployeeWage` results to fetch.
        schema:
          type: string
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTeamMemberWagesResponse'
  /v2/labor/team-member-wages/{id}:
    get:
      tags:
      - Labor
      summary: GetTeamMemberWage
      operationId: GetTeamMemberWage
      description: Returns a single `TeamMemberWage` specified by `id`.
      x-release-status: PUBLIC
      security:
      - oauth2:
        - EMPLOYEES_READ
      parameters:
      - name: id
        description: The UUID for the `TeamMemberWage` being retrieved.
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTeamMemberWageResponse'
  /v2/labor/timecards:
    post:
      tags:
      - Labor
      summary: CreateTimecard
      operationId: CreateTimecard
      description: 'Creates a new `Timecard`.


        A `Timecard` represents a complete workday for a single team member.

        You must provide the following values in your request to this

        endpoint:


        - `location_id`

        - `team_member_id`

        - `start_at`


        An attempt to create a new `Timecard` can result in a `BAD_REQUEST` error when:

        - The `status` of the new `Timecard` is `OPEN` and the team member has another

        timecard with an `OPEN` status.

        - The `start_at` date is in the future.

        - The `start_at` or `end_at` date overlaps another timecard for the same team member.

        - The `Break` instances are set in the request and a break `start_at`

        is before the `Timecard.start_at`, a break `end_at` is after

        the `Timecard.end_at`, or both.'
