    CreateScheduledShiftRequest:
      type: object
      description: Represents a [CreateScheduledShift](api-endpoint:Labor-CreateScheduledShift) request.
      x-release-status: BETA
      required:
      - scheduled_shift
      properties:
        idempotency_key:
          type: string
          description: 'A unique identifier for the `CreateScheduledShift` request, used to ensure the

            [idempotency](https://developer.squareup.com/docs/build-basics/common-api-patterns/idempotency)

            of the operation.'
