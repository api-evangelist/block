servers:
- url: https://connect.squareup.com
  variables: {}
tags:
- name: TransferOrder
paths:
  /v2/transfer-orders:
    post:
      tags:
      - TransferOrder
      summary: CreateTransferOrder
      operationId: CreateTransferOrder
      description: 'Creates a new transfer order in DRAFT status. A transfer order represents the intent

        to move CatalogItemVariations from one Location to another.

        The source and destination locations must be different and must belong to your Square account.


        In DRAFT status, you can:

        - Add or remove items

        - Modify quantities

        - Update shipping information

        - Delete the entire order via DeleteTransferOrder


        The request requires source_location_id and destination_location_id.

        Inventory levels are not affected until the order is started via

        StartTransferOrder.


        Common integration points:

        - Sync with warehouse management systems

        - Automate regular stock transfers

        - Initialize transfers from inventory optimization systems


        Creates a transfer_order.created webhook event.'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
        - INVENTORY_WRITE
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: RATE_LIMITED
  /v2/transfer-orders/search:
    post:
      tags:
      - TransferOrder
      summary: SearchTransferOrders
      operationId: SearchTransferOrders
      description: 'Searches for transfer orders using filters. Returns a paginated list of matching

        TransferOrders sorted by creation date.


        Common search scenarios:

        - Find orders for a source Location

        - Find orders for a destination Location

        - Find orders in a particular TransferOrderStatus'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
      parameters: []
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchTransferOrdersRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTransferOrdersResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: RATE_LIMITED
  /v2/transfer-orders/{transfer_order_id}:
    delete:
      tags:
      - TransferOrder
      summary: DeleteTransferOrder
      operationId: DeleteTransferOrder
      description: 'Deletes a transfer order in DRAFT status.

        Only draft orders can be deleted. Once an order is started via

        StartTransferOrder, it can no longer be deleted.


        Creates a transfer_order.deleted webhook event.'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_WRITE
      parameters:
      - name: transfer_order_id
        description: The ID of the transfer order to delete
        schema:
          type: string
        in: path
        required: true
      - name: version
        description: Version for optimistic concurrency
        schema:
          type: integer
          format: int64
        in: query
        required: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: INVALID_VALUE
      - error-code: RATE_LIMITED
    get:
      tags:
      - TransferOrder
      summary: RetrieveTransferOrder
      operationId: RetrieveTransferOrder
      description: 'Retrieves a specific TransferOrder by ID. Returns the complete

        order details including:


        - Basic information (status, dates, notes)

        - Line items with ordered and received quantities

        - Source and destination Locations

        - Tracking information (if available)'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
      parameters:
      - name: transfer_order_id
        description: The ID of the transfer order to retrieve
        schema:
          type: string
        in: path
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: RATE_LIMITED
    put:
      tags:
      - TransferOrder
      summary: UpdateTransferOrder
      operationId: UpdateTransferOrder
      description: 'Updates an existing transfer order. This endpoint supports sparse updates,

        allowing you to modify specific fields without affecting others.


        Creates a transfer_order.updated webhook event.'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
        - INVENTORY_WRITE
      parameters:
      - name: transfer_order_id
        description: The ID of the transfer order to update
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransferOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: INVALID_VALUE
      - error-code: VERSION_MISMATCH
      - error-code: RATE_LIMITED
  /v2/transfer-orders/{transfer_order_id}/cancel:
    post:
      tags:
      - TransferOrder
      summary: CancelTransferOrder
      operationId: CancelTransferOrder
      description: 'Cancels a transfer order in STARTED or

        PARTIALLY_RECEIVED status. Any unreceived quantities will no

        longer be receivable and will be immediately returned to the source Location''s inventory.


        Common reasons for cancellation:

        - Items no longer needed at destination

        - Source location needs the inventory

        - Order created in error


        Creates a transfer_order.updated webhook event.'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
        - INVENTORY_WRITE
      parameters:
      - name: transfer_order_id
        description: The ID of the transfer order to cancel. Must be in STARTED or PARTIALLY_RECEIVED status.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelTransferOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: INVALID_VALUE
      - error-code: RATE_LIMITED
  /v2/transfer-orders/{transfer_order_id}/receive:
    post:
      tags:
      - TransferOrder
      summary: ReceiveTransferOrder
      operationId: ReceiveTransferOrder
      description: 'Records receipt of CatalogItemVariations for a transfer order.

        This endpoint supports partial receiving - you can receive items in multiple batches.


        For each line item, you can specify:

        - Quantity received in good condition (added to destination inventory with InventoryState of IN_STOCK)

        - Quantity damaged during transit/handling (added to destination inventory with InventoryState of WASTE)

        - Quantity canceled (returned to source location''s inventory)


        The order must be in STARTED or PARTIALLY_RECEIVED status.

        Received quantities are added to the destination Location''s inventory according to their condition.

        Canceled quantities are immediately returned to the source Location''s inventory.


        When all items are either received, damaged, or canceled, the order moves to

        COMPLETED status.


        Creates a transfer_order.updated webhook event.'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
        - INVENTORY_WRITE
      parameters:
      - name: transfer_order_id
        description: The ID of the transfer order to receive items for
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiveTransferOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiveTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: INVALID_VALUE
      - error-code: RATE_LIMITED
  /v2/transfer-orders/{transfer_order_id}/start:
    post:
      tags:
      - TransferOrder
      summary: StartTransferOrder
      operationId: StartTransferOrder
      description: 'Changes a DRAFT transfer order to STARTED status.

        This decrements inventory at the source Location and marks it as in-transit.


        The order must be in DRAFT status and have all required fields populated.

        Once started, the order can no longer be deleted, but it can be canceled via

        CancelTransferOrder.


        Creates a transfer_order.updated webhook event.'
      x-release-status: BETA
      security:
      - oauth2:
        - INVENTORY_READ
        - INVENTORY_WRITE
      parameters:
      - name: transfer_order_id
        description: The ID of the transfer order to start. Must be in DRAFT status.
        schema:
          type: string
        in: path
        required: true
      requestBody:
        required: true
        description: 'An object containing the fields to POST for the request.


          See the corresponding object definition for field details.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTransferOrderRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartTransferOrderResponse'
      x-endpoint-errors:
      - error-code: BAD_REQUEST
      - error-code: NOT_FOUND
      - error-code: UNAUTHORIZED
      - error-code: INSUFFICIENT_PERMISSIONS
      - error-code: INVALID_VALUE
      - error-code: RATE_LIMITED
components:
  schemas:
    UpdateTransferOrderLineData:
      type: object
      description: Represents a line item update in a transfer order
      x-release-status: BETA
      properties:
        uid:
          type:
          - string
          - 'null'
          description: Line item id being updated. Required for updating/removing existing line items, but should not be set for new line items.
          minLength: 1
          maxLength: 64
        item_variation_id:
          type:
          - string
          - 'null'
          description: 'Catalog item variation being transferred


            Required for new line items, but otherwise is not updatable.'
          minLength: 1
          maxLength: 64
        quantity_ordered:
          type:
          - string
          - 'null'
          description: Total quantity ordered
          minLength: 1
          maxLength: 16
          pattern: ^(0|[1-9]\d*)(\.\d{1,4})?$
        remove:
          type:
          - boolean
          - 'null'
          description: Flag to remove the line item during update. Must include `uid` in removal request
    TransferOrderSortField:
      type: string
      enum:
      - CREATED_AT
      - UPDATED_AT
      x-enum-elements:
      - name: CREATED_AT
        description: 'Sort by creation date (created_at field). Useful for:

          - Finding newest transfers

          - Chronological order processing

          - Historical analysis

          - Auditing transfer patterns'
      - name: UPDATED_AT
        description: 'Sort by last update date (updated_at field). Useful for:

          - Finding recently modified transfers

          - Tracking status changes

          - Monitoring receiving progress

          - Synchronizing with external systems'
      description: 'Fields that can be used for sorting [TransferOrder](entity:TransferOrder)s in search results.

        Used with [SearchTransferOrders](api-endpoint:TransferOrders-SearchTransferOrders) to control

        the order of returned results.'
      x-release-status: BETA
    SortOrder:
      type: string
      enum:
      - DESC
      - ASC
      x-enum-elements:
      - name: DESC
        description: The results are returned in descending (e.g., newest-first or Z-A) order.
      - name: ASC
        description: The results are returned in ascending (e.g., oldest-first or A-Z) order.
      description: The order (e.g., chronological or alphabetical) in which results from a request are returned.
      x-release-status: PUBLIC
    CreateTransferOrderLineData:
      type: object
      description: "Data for creating a new transfer order line item. Each line item specifies a \n[CatalogItemVariation](entity:CatalogItemVariation) and quantity to transfer."
      x-release-status: BETA
      required:
      - item_variation_id
      - quantity_ordered
      properties:
        item_variation_id:
          type: string
          description: 'ID of the [CatalogItemVariation](entity:CatalogItemVariation) to transfer. Must reference a valid

            item variation in the [Catalog](api:Catalog). The item variation must be:

            - Active and available for sale

            - Enabled for inventory tracking

            - Available at the source location'
          minLength: 1
          maxLength: 64
        quantity_ordered:
          type: string
          description: Total quantity ordered
          minLength: 1
          maxLength: 16
          pattern: ^(0|[1-9]\d*)(\.\d{1,4})?$
    SearchTransferOrdersResponse:
      type: object
      description: Response for searching transfer orders
      x-release-status: BETA
      properties:
        transfer_orders:
          type: array
          items:
            $ref: '#/components/schemas/TransferOrder'
          description: List of transfer orders matching the search criteria
        cursor:
          type: string
          description: Pagination cursor for fetching the next page of results
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Any errors that occurred during the request
      example:
        cursor: eyJsYXN0X3VwZGF0ZWRfYXQiOjE3NTMxMTU1NDBfMTIzfQ==
        transfer_orders:
        - created_at: '2025-01-15T10:30:00Z'
          created_by_team_member_id: EXAMPLE_TEAM_MEMBER_ID_789
          destination_location_id: EXAMPLE_DEST_LOCATION_ID_456
          expected_at: '2025-11-09T05:00:00Z'
          id: EXAMPLE_TRANSFER_ORDER_ID_123
          line_items:
          - item_variation_id: EXAMPLE_ITEM_VARIATION_ID_001
            quantity_canceled: '0'
            quantity_damaged: '0'
            quantity_ordered: '5'
            quantity_pending: '5'
            quantity_received: '0'
            uid: '1'
          notes: Inventory rebalance between stores
          source_location_id: EXAMPLE_SOURCE_LOCATION_ID_123
          status: STARTED
          tracking_number: TRACK123456789
          updated_at: '2025-01-15T10:32:00Z'
          version: 1753118664873
        - created_at: '2025-01-14T14:20:00Z'
          destination_location_id: EXAMPLE_DEST_LOCATION_ID_456
          expected_at: '2025-11-08T12:00:00Z'
          id: EXAMPLE_TRANSFER_ORDER_ID_456
          line_items:
          - item_variation_id: EXAMPLE_ITEM_VARIATION_ID_002
            quantity_canceled: '0'
            quantity_damaged: '0'
            quantity_ordered: '10'
            quantity_pending: '3'
            quantity_received: '7'
            uid: '1'
          notes: Seasonal stock transfer
          source_location_id: EXAMPLE_SOURCE_LOCATION_ID_123
          status: PARTIALLY_RECEIVED
          updated_at: '2025-01-15T09:45:00Z'
          version: 1753115540123
    CreateTransferOrderResponse:
      type: object
      description: Response for creating a transfer order.
      x-release-status: BETA
      properties:
        transfer_order:
          $ref: '#/components/schemas/TransferOrder'
          description: The created transfer order
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Any errors that occurred during the request
      example:
        transfer_order:
          created_at: '2025-01-15T10:30:00Z'
          created_by_team_member_id: EXAMPLE_TEAM_MEMBER_ID_789
          destination_location_id: EXAMPLE_DEST_LOCATION_ID_456
          expected_at: '2025-11-09T05:00:00Z'
          id: EXAMPLE_TRANSFER_ORDER_ID_123
          line_items:
          - item_variation_id: EXAMPLE_ITEM_VARIATION_ID_001
            quantity_canceled: '0'
            quantity_damaged: '0'
            quantity_ordered: '5'
            quantity_pending: '5'
            quantity_received: '0'
            uid: '1'
          - item_variation_id: EXAMPLE_ITEM_VARIATION_ID_002
            quantity_canceled: '0'
            quantity_damaged: '0'
            quantity_ordered: '3'
            quantity_pending: '3'
            quantity_received: '0'
            uid: '2'
          notes: Example transfer order for inventory redistribution between locations
          source_location_id: EXAMPLE_SOURCE_LOCATION_ID_123
          status: DRAFT
          tracking_number: TRACK123456789
          updated_at: '2025-01-15T10:30:00Z'
          version: 1753109537351
    StartTransferOrderRequest:
      type: object
      description: Request to start a transfer order, changing its status from DRAFT to STARTED.
      x-release-status: BETA
      required:
      - idempotency_key
      properties:
        idempotency_key:
          type: string
          description: 'A unique string that identifies this UpdateTransferOrder request. Keys can be

            any valid string but must be unique for every UpdateTransferOrder request.'
          minLength: 1
        version:
          type: integer
          description: Version for optimistic concurrency
          format: int64
      example:
        idempotency_key: EXAMPLE_IDEMPOTENCY_KEY_789
        transfer_order_id: EXAMPLE_TRANSFER_ORDER_ID_123
        version: 1753109537351
    TransferOrder:
      type: object
      description: "Represents a transfer order for moving [CatalogItemVariation](entity:CatalogItemVariation)s \nbetween [Location](entity:Location)s. Transfer orders track the entire lifecycle of an inventory \ntransfer, including:\n- What items and quantities are being moved\n- Source and destination locations\n- Current [TransferOrderStatus](entity:TransferOrderStatus)\n- Shipping information and tracking\n- Which [TeamMember](entity:TeamMember) initiated the transfer\n\nThis object is commonly used to:\n- Track [CatalogItemVariation](entity:CatalogItemVariation) movements between [Location](entity:Location)s\n- Reconcile expected vs received quantities\n- Monitor transfer progress and shipping status\n- Audit inventory movement history"
      x-release-status: BETA
      properties:
        id:
          type: string
          description: 'Unique system-generated identifier for this transfer order. Use this ID for:

            - Retrieving transfer order details

            - Tracking status changes via webhooks

            - Linking transfers in external systems'
          readOnly: true
        source_location_id:
          type:
          - string
          - 'null'
          description: 'The source [Location](entity:Location) sending the [CatalogItemVariation](entity:CatalogItemVariation)s.

            This location must:

            - Be active in your Square organization

            - Have sufficient inventory for the items being transferred

            - Not be the same as the destination location


            This field is not updatable.'
        destination_location_id:
          type:
          - string
          - 'null'
          description: 'The destination [Location](entity:Location) receiving the [CatalogItemVariation](entity:CatalogItemVariation)s.

            This location must:

            - Be active in your Square organization

            - Not be the same as the source location


            This field is not updatable.'
        status:
          $ref: '#/components/schemas/TransferOrderStatus'
          description: "Current [TransferOrderStatus](entity:TransferOrderStatus) indicating where the order is in its lifecycle.\nStatus transitions follow this progression:\n1. [DRAFT](entity:TransferOrderStatus) -> [STARTED](entity:TransferOrderStatus) via [StartTransferOrder](api-endpoint:TransferOrders-StartTransferOrder)\n2. [STARTED](entity:TransferOrderStatus) -> [PARTIALLY_RECEIVED](entity:TransferOrderStatus) via [ReceiveTransferOrder](api-endpoint:TransferOrders-ReceiveTransferOrder)\n3. [PARTIALLY_RECEIVED](entity:TransferOrderStatus) -> [COMPLETED](entity:TransferOrderStatus) after all items received\n\nOrders can be [CANCELED](entity:TransferOrderStatus) from [STARTED](entity:TransferOrderStatus) or \n[PARTIALLY_RECEIVED](entity:TransferOrderStatus) status.\n\nThis field is read-only and reflects the current state of the transfer order, and cannot be updated directly. Use the appropriate\nendpoints (e.g. [StartPurchaseOrder](api-endpoint:TransferOrders-StartTransferOrder), to change the status.\nSee [TransferOrderStatus](#type-transferorderstatus) for possible values"
          readOnly: true
        created_at:
          type: string
          description: 'Timestamp when the transfer order was created, in RFC 3339 format.

            Used for:

            - Auditing transfer history

            - Tracking order age

            - Reporting and analytics'
          readOnly: true
        updated_at:
          type: string
          description: 'Timestamp when the transfer order was last updated, in RFC 3339 format.

            Updated when:

            - Order status changes

            - Items are received

            - Notes or metadata are modified'
          readOnly: true
        expected_at:
          type:
          - string
          - 'null'
          description: 'Expected transfer completion date, in RFC 3339 format.

            Used for:

            - Planning inventory availability

            - Scheduling receiving staff

            - Monitoring transfer timeliness'
        completed_at:
          type: string
          description: Timestamp when the transfer order was completed or canceled, in RFC 3339 format (e.g. "2023-10-01T12:00:00Z").
          readOnly: true
        notes:
          type:
          - string
